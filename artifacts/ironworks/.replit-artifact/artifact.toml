kind = "web"
previewPath = "/"
title = "Ironworks"
version = "1.0.0"
id = "artifacts/ironworks"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20254

[services.development]
run = "pnpm --filter @workspace/ironworks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/api-server", "run", "build:production" ]

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.production.run.env]
PORT = "20254"
NODE_ENV = "production"
IRONWORKS_DIST_PATH = "artifacts/ironworks/dist/public"

[services.env]
PORT = "20254"
BASE_PATH = "/"
